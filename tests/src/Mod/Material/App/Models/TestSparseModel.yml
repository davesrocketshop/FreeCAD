Model:
  Name: 'Test Sparse Model'
  UUID: '807a4b37-da41-4b7a-a730-8555cae4146b'
  URL: ''
  Description: 'Demonstrate the different model types'
  DOI: ''
  TestArray2D:
    Type: '2DArray'
    Columns:
      Temperature:
        Type: 'Quantity'
        Units: 'C'
        URL: ''
        Description: "Temperature"
      Density:
        Type: 'Quantity'
        Units: 'kg/m^3'
        URL: 'https://en.wikipedia.org/wiki/Density'
        Description: "Density in [FreeCAD Density unit]"
      TestFloat:
        Type: 'Float'
        Units: ''
        URL: ''
        Description: "A Float"
    URL: ''
    Description: >
      2 Dimensional array showing density with temperature
  TestArray3D:
    Type: '3DArray'
    Columns:
      Temperature:
        Type: 'Quantity'
        Units: 'C'
        URL: ''
        Description: "Temperature"
      Stress:
        Type: 'Quantity'
        Units: 'MPa'
        URL: ''
        Description: "Stress"
      Strain:
        Type: 'Quantity'
        Units: 'MPa'
        URL: ''
        Description: "Strain"
    URL: ''
    Description: >
      3 Dimensional array showing stress and strain as
      a function of temperature
